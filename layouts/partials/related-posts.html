{{ $related := first 3 ( where ( where .Site.Pages.ByDate.Reverse ".Params.tags" "intersect" .Params.tags ) "Permalink" "!=" .Permalink ) }}
{{ with $related }}
<!-- begin related posts -->
<div class="container">
  <section class="section related-posts">
    <div class="section__info section__info__center">
      <div class="section__head">
        <span class="section__intro">{{ i18n "related_posts" }}</span>
        <h2 class="section__title">{{ i18n "in_case_you_missed" }}</h2>
      </div>
    </div>
    <div class="row">
      {{ range . }}
        {{ partial "article.html" . }}
      {{ end }}
    </div>
  </section>
</div>
<!-- end related posts -->
{{ end }}
