        author_section_description = "Wenn du die Leidenschaft für Innovation, Technologie und digitale Lösungen teilst, würde ich gerne von dir hören. Schreib mir und lass uns gemeinsam neue Möglichkeiten erkunden!"
        author_section_button_text = "Lass uns reden!"
      [languages.de.params.featured]
