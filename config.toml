    enable = false
    testimonials_intro = "Don't take my word for it"
    testimonials_title = "See what our happy clients say..."
    testimonials_info = "Join over <b>10K+</b> Prefessionals"

  [[params.testimonial_item]]
    name = "Martin Vetrovs"
    image = "https://via.placeholder.com/120x120"
    designation = "Data Scientist"
    title = "Incredible attention to detail"
    content = "The incredible attention to detail displayed by this team is commendable. Every aspect of our project, no matter how small, was handled with precision and care. The result is a product that reflects their commitment to excellence."

  [[params.testimonial_item]]
    name = "Hanna Herwitz"
    image = "https://via.placeholder.com/120x120"
    designation = "UI/UX Designer"
    title = "Collaborative partnership"
    content = "Our partnership with this team was characterized by open communication and collaborative efforts. They took the time to understand our goals and delivered a solution that perfectly aligns with our business objectives. Looking forward to future collaborations."

  [[params.testimonial_item]]
    name = "Carter Curtis"
    image = "https://via.placeholder.com/120x120"
    designation = "DevOps Engineer"
    title = "Creative brilliance unleashed"
    content = "Working with this creative powerhouse was an enlightening experience. Their brilliance in design thinking and creative solutions brought our project to life in ways we hadn't imagined. The team's passion for innovation is truly infectious."

  [[params.testimonial_item]]
    name = "Marcus Vaccaro"
    image = "/images/krakiun-avatar.png"
    designation = "Systems Analyst"
    title = "Efficient problem solvers"
    content = "This team proved to be efficient problem solvers throughout our project. When faced with challenges, they tackled them with creativity and resourcefulness. Their ability to overcome obstacles ensured a smooth and successful project delivery."


  #-------------------------------
  # Faq (Frequently asked questions) Settings
  [params.faq]
    enable = true
    faq_intro = "Ai nevoie de răspunsuri?"
    faq_title = "Întrebări frecvente"

  [[params.faq_item]]
    title = "Oferi consultanță sau servicii personalizate?"
    description = "Nu, nu ofer consultanță sau servicii personalizate. Aleg să-mi dedic timpul dezvoltării de produse, soluții automate și business-uri digitale care reflectă viziunea mea. Consider că acestea sunt cea mai bună expresie a cunoștințelor și experienței mele."

  [[params.faq_item]]
    title = "Pot colabora cu tine la un proiect? Dacă da, cum?"
    description = "Da, colaborarea este posibilă, dar doar dacă ai cunoștințele, mijloacele sau resursele necesare pentru a contribui la îmbunătățirea proiectelor la care lucrez. Caut parteneri care pot aduce valoare reală și care împărtășesc aceeași viziune și pasiune pentru inovație și tehnologie. În schimbul ajutorului oferit, pot oferi recompense precum tokene, acțiuni sau NFT-uri din proiectul la care contribuim împreună. Dacă te simți pregătit să aduci un aport semnificativ, te invit să mă contactezi prin datele din pagina de contact."

  [[params.faq_item]]
    title = "Cum pot să iau legătura cu tine pentru a discuta ?"
    description = "Pentru a lua legătura cu mine și a discuta idei, te invit să folosești informațiile disponibile în pagina de contact a acestui blog. Fie că este vorba despre un e-mail, whatsapp, telegram, voi răspunde cu plăcere dacă ideile tale sunt relevante și bine fundamentate. Îmi rezerv timpul pentru discuții care aduc valoare reală proiectelor mele, așa că asigură-te că mesajul tău este clar și concis. Aștept cu interes să descopăr idei noi și perspective inovatoare!"

  [[params.faq_item]]
    title = "Cum pot susține proiectele tale?"
    description = "Poți susține proiectele mele în mai multe moduri, în funcție de resursele și expertiza pe care le poți oferi. Fie că este vorba despre idei noi, feedback constructiv, resurse tehnice, sau chiar sprijin financiar, fiecare contribuție contează. Dacă dorești să te implici, mă poți contacta prin pagina de contact pentru a discuta detaliile."


