        faq_title = "Häufig gestellte Fragen"

  [[languages.de.params.faq_item]]
    title = "Bietest du Beratung oder personalisierte Dienstleistungen an?"
    description = "Nein. Meine Philosophie ist es, Vermögenswerte aufzubauen, nicht Stunden zu verkaufen. Ich widme meine Zeit ausschließlich der Entwicklung von Produkten und automatisierten Systemen. Ich glaube, dass der wahre langfristige Wert darin liegt, skalierbare Lösungen zu schaffen, nicht 1-zu-1-Dienstleistungen anzubieten."

  [[languages.de.params.faq_item]]
    title = "Arbeitest du alleine an Projekten?"
    description = "Nein. Die meisten Projekte werden zusammen mit einem kleinen Team von Mitarbeitern entwickelt. In den letzten Jahren habe ich je nach Projekt konstant mit 1-7 Personen zusammengearbeitet. Meine Hauptrolle ist die Definition von Strategie, technischer Architektur und Produktrichtung."

  [[languages.de.params.faq_item]]
    title = "Kann ich mit dir an einem Projekt zusammenarbeiten? Wenn ja, wie?"
    description = "Ich bin immer auf der Suche nach außergewöhnlichen Partnern, nicht nur nach Mitarbeitern. Ich suche Menschen, die erstklassige Kompetenz und vollständige Übereinstimmung mit der Vision mitbringen. Strategische Partnerschaften sind auf Leistung und langfristiges Engagement ausgerichtet."

  [[languages.de.params.faq_item]]
    title = "Wie kann ich dich für ein Gespräch kontaktieren?"
    description = "Der effizienteste Weg ist über die Kontaktseite. Ich priorisiere strategische Gespräche und gut formulierte Vorschläge. Ich habe keine Zeit für oberflächliche Diskussionen, aber ich antworte immer mit Interesse auf Nachrichten, die Substanz und echtes Potenzial zeigen."

  [[languages.de.params.faq_item]]
    title = "Wie kann ich deine Projekte unterstützen?"
    description = "Die wertvollste Unterstützung ist strategischer Natur. Eine Vorstellung bei einem relevanten Partner, fundiertes Feedback basierend auf tiefem Fachwissen oder eine Marktchance, die ich nicht gesehen habe, sind viel wertvoller als alles andere."

