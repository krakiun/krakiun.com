        author_section_description = "Se condividi la passione per l'innovazione, la tecnologia e le soluzioni digitali, mi piacerebbe sentirti. Scrivimi e esploriamo insieme nuove opportunità!"
        author_section_button_text = "Parliamone!"
      [languages.it.params.featured]
