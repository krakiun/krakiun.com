        faq_title = "Domande frequenti"

  [[languages.it.params.faq_item]]
    title = "Offri consulenza o servizi personalizzati?"
    description = "No. La mia filosofia è costruire asset, non vendere ore. Dedico il mio tempo esclusivamente allo sviluppo di prodotti e sistemi automatizzati. Credo che il vero valore a lungo termine stia nel creare soluzioni scalabili, non nell'offrire servizi 1-a-1."

  [[languages.it.params.faq_item]]
    title = "Lavori da solo sui progetti?"
    description = "No. La maggior parte dei progetti viene sviluppata insieme a un piccolo team di collaboratori. Negli ultimi anni ho lavorato costantemente con 1-7 persone, a seconda del progetto. Il mio ruolo principale è definire strategia, architettura tecnica e direzione del prodotto."

  [[languages.it.params.faq_item]]
    title = "Posso collaborare con te su un progetto? Se sì, come?"
    description = "Sono sempre alla ricerca di partner eccezionali, non solo collaboratori. Cerco persone che portino competenze di alto livello e un allineamento totale con la visione. Le partnership strategiche sono strutturate su performance e impegno a lungo termine."

  [[languages.it.params.faq_item]]
    title = "Come posso contattarti per discutere?"
    description = "Il modo più efficiente è attraverso la pagina di contatto. Prioritizzo conversazioni strategiche e proposte ben articolate. Non ho tempo per discussioni superficiali, ma rispondo sempre con interesse ai messaggi che dimostrano sostanza e potenziale reale."

  [[languages.it.params.faq_item]]
    title = "Come posso supportare i tuoi progetti?"
    description = "Il supporto più prezioso è quello strategico. Un'introduzione a un partner rilevante, un feedback pertinente basato su competenze profonde o un'opportunità di mercato che non ho visto sono molto più preziosi di qualsiasi altra cosa."

