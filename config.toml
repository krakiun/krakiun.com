  [[languages.es.params.faq_item]]
    title = "¿Ofreces consultoría o servicios personalizados?"
    description = "No. Mi filosofía es construir activos, no vender horas. Dedico mi tiempo exclusivamente al desarrollo de productos y sistemas automatizados. Creo que el verdadero valor a largo plazo está en crear soluciones escalables, no en ofrecer servicios 1-a-1."

  [[languages.es.params.faq_item]]
    title = "¿Trabajas solo en los proyectos?"
    description = "No. La mayoría de los proyectos se desarrollan junto con un pequeño equipo de colaboradores. En los últimos años he trabajado constantemente con 1-7 personas, dependiendo del proyecto. Mi rol principal es definir estrategia, arquitectura técnica y dirección del producto."

  [[languages.es.params.faq_item]]
    title = "¿Puedo colaborar contigo en un proyecto? Si es así, ¿cómo?"
    description = "Siempre estoy buscando socios excepcionales, no solo colaboradores. Busco personas que aporten competencias de primer nivel y una alineación total con la visión. Las asociaciones estratégicas están estructuradas en rendimiento y compromiso a largo plazo."

  [[languages.es.params.faq_item]]
    title = "¿Cómo puedo contactarte para discutir?"
    description = "La forma más eficiente es a través de la página de contacto. Priorizo conversaciones estratégicas y propuestas bien articuladas. No tengo tiempo para discusiones superficiales, pero siempre respondo con interés a los mensajes que demuestran sustancia y potencial real."

  [[languages.es.params.faq_item]]
    title = "¿Cómo puedo apoyar tus proyectos?"
    description = "El apoyo más valioso es el estratégico. Una introducción a un socio relevante, un feedback pertinente basado en experiencia profunda o una oportunidad de mercado que no he visto son mucho más valiosos que cualquier otra cosa."

