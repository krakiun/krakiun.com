#-------------------------------
# General Site Settings
baseURL = "https://krakiun.com/"
title = "Craciun Florentin Simion"
googleAnalytics = "G-VPWWV8F4X9"
publishDir = "docs"

#-------------------------------
# Multi-Language Settings
defaultContentLanguage = "ro"
defaultContentLanguageInSubdir = false

[languages]
  [languages.ro]
    languageCode = "ro-RO"
    languageName = "Română"
    weight = 1
    contentDir = "content/ro"
    [languages.ro.params]
      description = "Blog personal Krakiun"
      [languages.ro.params.hero]
        enable = true
        hero_title = "growth strategist."
        hero_description = "Sunt un strateg neconvențional, în căutarea soluțiilor simple pentru provocările complexe."
      [languages.ro.params.blog]
        enable = true
        blog_intro = "Ce e nou?"
        blog_title = "Ultimele de pe blog"
      [languages.ro.params.author_section]
        enable = true
        author_section_title = "Salut 👋 !  Bine ai venit în colțul meu digital – locul unde ideile prind viață."
        author_section_description = "Dacă împărtășești pasiunea pentru inovație, tehnologie și soluții digitale, mi-ar plăcea să aud de la tine. Scrie-mi și hai să explorăm împreună noi oportunități!"
        author_section_button_text = "Hai să discutăm!"
      [languages.ro.params.featured]
        enable = true
        featured_title = "Proiecte"
      [languages.ro.params.projects]
        enable = true
        projects_title = "Proiecte în curs"
      [languages.ro.params.faq]
        enable = true
        faq_intro = "Ai nevoie de răspunsuri?"
        faq_title = "Întrebări frecvente"

  [[languages.ro.params.faq_item]]
    title = "Oferi consultanță sau servicii personalizate?"
    description = "Nu. Filozofia mea este să construiesc active, nu să vând ore. Îmi dedic timpul exclusiv dezvoltării de produse și sisteme automate. Cred că valoarea reală pe termen lung stă în a crea soluții scalabile, nu în a oferi servicii 1-la-1."

  [[languages.ro.params.faq_item]]
    title = "Lucrezi singur la proiecte?"
    description = "Nu. Majoritatea proiectelor sunt dezvoltate împreună cu o echipă restrânsă de colaboratori. În ultimii ani am lucrat constant cu 1–7 persoane, în funcție de proiect. Rolul meu principal este definirea strategiei, arhitecturii tehnice și a direcției produsului."

  [[languages.ro.params.faq_item]]
    title = "Pot colabora cu tine la un proiect? Dacă da, cum?"
    description = "Sunt mereu în căutarea unor parteneri excepționali, nu doar a unor colaboratori. Caut oameni care aduc o competență de top și o aliniere totală la viziune. Parteneriatele strategice sunt structurate pe performanță și angajament pe termen lung."

  [[languages.ro.params.faq_item]]
    title = "Cum pot să iau legătura cu tine pentru a discuta?"
    description = "Cel mai eficient mod este prin pagina de contact. Prioritizez conversațiile strategice și propunerile bine articulate. Nu am timp pentru discuții superficiale, dar răspund întotdeauna cu interes mesajelor care demonstrează substanță și potențial real."

  [[languages.ro.params.faq_item]]
    title = "Cum pot susține proiectele tale?"
    description = "Cel mai valoros sprijin este cel strategic. O introducere către un partener relevant, un feedback pertinent bazat pe o expertiză profundă sau o oportunitate de piață pe care nu am văzut-o sunt mult mai valoroase decât orice altceva."

  [languages.en]
    languageCode = "en-US"
    languageName = "English"
    weight = 2
    contentDir = "content/en"
    [languages.en.params]
      description = "Krakiun Personal Blog"
      [languages.en.params.hero]
        enable = true
        hero_title = "growth strategist."
        hero_description = "I'm an unconventional strategist, seeking simple solutions for complex challenges."
      [languages.en.params.blog]
        enable = true
        blog_intro = "What's new?"
        blog_title = "Latest from the blog"
      [languages.en.params.author_section]
        enable = true
        author_section_title = "Hi 👋 ! Welcome to my digital corner – the place where ideas come to life."
        author_section_description = "If you share the passion for innovation, technology and digital solutions, I'd love to hear from you. Write to me and let's explore new opportunities together!"
        author_section_button_text = "Let's talk!"
      [languages.en.params.featured]
        enable = true
        featured_title = "Projects"
      [languages.en.params.projects]
        enable = true
        projects_title = "Current projects"
      [languages.en.params.faq]
        enable = true
        faq_intro = "Need answers?"
        faq_title = "Frequently asked questions"

  [[languages.en.params.faq_item]]
    title = "Do you offer consulting or personalized services?"
    description = "No. My philosophy is to build assets, not sell hours. I dedicate my time exclusively to developing products and automated systems. I believe that real long-term value lies in creating scalable solutions, not in offering 1-on-1 services."

  [[languages.en.params.faq_item]]
    title = "Do you work alone on projects?"
    description = "No. Most projects are developed together with a small team of collaborators. In recent years, I've consistently worked with 1-7 people, depending on the project. My main role is defining strategy, technical architecture, and product direction."

  [[languages.en.params.faq_item]]
    title = "Can I collaborate with you on a project? If so, how?"
    description = "I'm always looking for exceptional partners, not just collaborators. I look for people who bring top-tier competence and total alignment with the vision. Strategic partnerships are structured on performance and long-term commitment."

  [[languages.en.params.faq_item]]
    title = "How can I get in touch with you to discuss?"
    description = "The most efficient way is through the contact page. I prioritize strategic conversations and well-articulated proposals. I don't have time for superficial discussions, but I always respond with interest to messages that demonstrate substance and real potential."

  [[languages.en.params.faq_item]]
    title = "How can I support your projects?"
    description = "The most valuable support is strategic. An introduction to a relevant partner, pertinent feedback based on deep expertise, or a market opportunity I haven't seen are much more valuable than anything else."

