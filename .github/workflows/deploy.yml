name: Deploy Hugo site to Pages

on:
  # Rulează workflow-ul la fiecare push pe branch-ul main
  push:
    branches: ["main"]

  # Permite rularea manuală a workflow-ului din tab-ul Actions
  workflow_dispatch:

  # Rulează automat în fiecare zi la 08:00 UTC (11:00 România)
  schedule:
    - cron: '0 8 * * *'

# Setează permisiunile GITHUB_TOKEN pentru a permite deployment pe Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Permite doar un deployment concurrent, anulând cele în curs dacă există unul nou
concurrency:
  group: "pages"
  cancel-in-progress: false

# Setări default pentru toate job-urile
defaults:
  run:
    shell: bash

jobs:
  # Job pentru construirea site-ului
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.147.6
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb          
      
      - name: Install Dart Sass
        run: sudo snap install dart-sass
      
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Publică postări programate
        run: |
          echo "🕐 Verificare postări programate pentru $(date '+%Y-%m-%d')"
          
          TODAY=$(date -u '+%Y-%m-%d')
          POSTS_UPDATED=0
          UPDATED_FILES=""
          
          # Caută postări draft cu data ≤ astăzi
          for file in content/posts/*.md; do
            if [ -f "$file" ]; then
              # Verifică dacă este draft
              if grep -q "draft: true" "$file"; then
                # Extrage data din front matter
                POST_DATE=$(grep "^date:" "$file" | sed 's/date: //' | sed 's/T.*//' | tr -d '"' | tr -d "'")
                
                echo "📄 Post draft găsit: $(basename "$file")"
                echo "   📅 Data postului: $POST_DATE"
                echo "   📅 Data de astăzi: $TODAY"
                
                # Compară datele (format YYYY-MM-DD)
                if [ "$POST_DATE" \< "$TODAY" ] || [ "$POST_DATE" = "$TODAY" ]; then
                  echo "   ✅ Publicare post: $POST_DATE ≤ $TODAY"
                  
                  # Schimbă draft: true în draft: false
                  sed -i 's/draft: true/draft: false/' "$file"
                  
                  POSTS_UPDATED=$((POSTS_UPDATED + 1))
                  UPDATED_FILES="$UPDATED_FILES $(basename "$file")"
                  echo "   🚀 Post publicat: $(basename "$file")"
                else
                  echo "   ⏳ Post rămâne draft: $POST_DATE > $TODAY"
                fi
              fi
            fi
          done
          
          echo "📊 Rezultat: $POSTS_UPDATED postări publicate"
          
          # Dacă am actualizat fișiere, fă commit și push
          if [ $POSTS_UPDATED -gt 0 ]; then
            echo "📤 Commit și push pentru postările publicate..."
            
            git config --local user.email "action@github.com"
            git config --local user.name "GitHub Action"
            
            git add content/posts/*.md
            git commit -m "🤖 Publicare automată: $POSTS_UPDATED postări ($UPDATED_FILES)"
            git push
            
            echo "✅ Postări publicate automat: $UPDATED_FILES"
          else
            echo "💤 Nu există postări de publicat astăzi"
          fi
      
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      
      - name: Install Node.js dependencies
        run: "[[ -f package-lock.json || -f npm-shrinkwrap.json ]] && npm ci || true"
      
      - name: Build with Hugo
        env:
          # Pentru maximum forward compatibility cu Hugo modules
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          hugo \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"          
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  # Job pentru deployment
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Job pentru notificări după deployment cu succes
  notify:
    runs-on: ubuntu-latest
    needs: [build, deploy]
    if: success()
    steps:
      - name: Checkout pentru notificări
        uses: actions/checkout@v4

      - name: Ping Google pentru indexare
        run: |
          echo "🔍 Ping la Google pentru indexare..."
          curl -s "https://www.google.com/ping?sitemap=https://customai.ro/sitemap.xml" || echo "Google ping failed"
          
      - name: Ping Bing pentru indexare
        run: |
          echo "🔍 Ping la Bing pentru indexare..."
          curl -s "https://www.bing.com/ping?sitemap=https://customai.ro/sitemap.xml" || echo "Bing ping failed"

      - name: Notificare webhook personalizat
        if: ${{ secrets.WEBHOOK_URL }}
        run: |
          echo "📡 Trimitere notificare webhook..."
          curl -X POST "${{ secrets.WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "text": "🚀 CustomAi site updated!",
              "site": "https://customai.ro",
              "timestamp": "'$(date -u +%Y-%m-%dT%H:%M:%SZ)'",
              "trigger": "${{ github.event_name }}",
              "commit": "${{ github.sha }}",
              "author": "${{ github.actor }}"
            }' || echo "Webhook notification failed"

      - name: Notificare Discord (opțional)
        if: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          echo "💬 Trimitere notificare Discord..."
          curl -X POST "${{ secrets.DISCORD_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d '{
              "embeds": [{
                "title": "🤖 CustomAi Site Updated",
                "description": "Site-ul a fost actualizat cu succes!",
                "color": 5814783,
                "fields": [
                  {"name": "🌐 Site", "value": "https://customai.ro", "inline": true},
                  {"name": "⚡ Trigger", "value": "${{ github.event_name }}", "inline": true},
                  {"name": "👤 Author", "value": "${{ github.actor }}", "inline": true}
                ],
                "timestamp": "'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"
              }]
            }' || echo "Discord notification failed"

      - name: Notificare Telegram (opțional)
        if: ${{ secrets.TELEGRAM_BOT_TOKEN && secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "📱 Trimitere notificare Telegram..."
          curl -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -H "Content-Type: application/json" \
            -d '{
              "chat_id": "${{ secrets.TELEGRAM_CHAT_ID }}",
              "text": "🤖 *CustomAi Site Updated*\n\n🌐 Site: https://customai.ro\n⚡ Trigger: ${{ github.event_name }}\n👤 Author: ${{ github.actor }}\n🕐 Time: '$(date -u +%Y-%m-%d\ %H:%M:%S\ UTC)'",
              "parse_mode": "Markdown"
            }' || echo "Telegram notification failed"

      - name: Ping servicii de monitorizare
        run: |
          echo "📊 Ping servicii de monitorizare..."
          
          # UptimeRobot heartbeat (dacă ai configurat)
          if [ -n "${{ secrets.UPTIMEROBOT_HEARTBEAT }}" ]; then
            curl -s "${{ secrets.UPTIMEROBOT_HEARTBEAT }}" || echo "UptimeRobot ping failed"
          fi
          
          # Ping generic pentru orice alt serviciu
          if [ -n "${{ secrets.MONITORING_PING_URL }}" ]; then
            curl -s "${{ secrets.MONITORING_PING_URL }}" || echo "Monitoring ping failed"
          fi

      - name: Actualizare cache CDN (opțional)
        run: |
          echo "🔄 Actualizare cache CDN..."
          
          # Cloudflare cache purge (dacă folosești Cloudflare)
          if [ -n "${{ secrets.CLOUDFLARE_ZONE_ID }}" ] && [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            curl -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
              -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d '{"purge_everything":true}' || echo "Cloudflare cache purge failed"
          fi

      - name: Log deployment success
        run: |
          echo "✅ Deployment complet cu succes!"
          echo "🌐 Site: https://customai.ro"
          echo "📅 Data: $(date -u +%Y-%m-%d\ %H:%M:%S\ UTC)"
          echo "🔄 Trigger: ${{ github.event_name }}"
          echo "👤 Author: ${{ github.actor }}" 